<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusTix | Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#06081C] text-white min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
        <a href="/" class="inline-flex items-center gap-2">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center font-black">C</div>
            <span class="text-2xl font-black tracking-tight">Campus<span class="text-indigo-400">Tix</span></span>
        </a>
        <p class="text-slate-500 text-sm mt-2">Your tickets. Any event. Any email.</p>
    </div>

    <!-- Card -->
    <div class="bg-[#0E1028] border border-white/8 rounded-3xl p-8 shadow-2xl">

        <!-- Toggle Tabs -->
        <div class="flex bg-black/30 rounded-xl p-1 mb-7">
            <button id="tab-login" onclick="showTab('login')"
                class="flex-1 py-2 rounded-lg text-sm font-bold transition-all bg-indigo-600 text-white">
                Sign In
            </button>
            <button id="tab-register" onclick="showTab('register')"
                class="flex-1 py-2 rounded-lg text-sm font-bold transition-all text-slate-400 hover:text-white">
                Create Account
            </button>
        </div>

        <!-- Error / Success Message -->
        <div id="msg" class="hidden mb-5 px-4 py-3 rounded-xl text-sm font-medium"></div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="text-xs text-slate-400 font-semibold uppercase tracking-widest block mb-1.5">Email</label>
                <input id="login-email" type="email" placeholder="you@example.com" required
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-indigo-500/60 focus:bg-white/8 transition-all placeholder-slate-600">
            </div>
            <div>
                <label class="text-xs text-slate-400 font-semibold uppercase tracking-widest block mb-1.5">Password</label>
                <input id="login-password" type="password" placeholder="••••••••" required
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-indigo-500/60 focus:bg-white/8 transition-all placeholder-slate-600">
            </div>
            <button type="submit" id="login-btn"
                class="w-full bg-indigo-600 hover:bg-indigo-500 py-3.5 rounded-xl font-bold text-sm uppercase tracking-widest transition-all active:scale-[0.98] mt-2">
                Sign In
            </button>
        </form>

        <!-- Register Form -->
        <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
            <div>
                <label class="text-xs text-slate-400 font-semibold uppercase tracking-widest block mb-1.5">Full Name</label>
                <input id="reg-name" type="text" placeholder="Jane Smith" required
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-indigo-500/60 focus:bg-white/8 transition-all placeholder-slate-600">
            </div>
            <div>
                <label class="text-xs text-slate-400 font-semibold uppercase tracking-widest block mb-1.5">Email</label>
                <input id="reg-email" type="email" placeholder="you@example.com" required
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-indigo-500/60 focus:bg-white/8 transition-all placeholder-slate-600">
                <p class="text-slate-600 text-[11px] mt-1">Any email works — personal, school, work.</p>
            </div>
            <div>
                <label class="text-xs text-slate-400 font-semibold uppercase tracking-widest block mb-1.5">Password</label>
                <input id="reg-password" type="password" placeholder="Min. 8 characters" required minlength="6"
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-indigo-500/60 focus:bg-white/8 transition-all placeholder-slate-600">
            </div>
            <button type="submit" id="register-btn"
                class="w-full bg-indigo-600 hover:bg-indigo-500 py-3.5 rounded-xl font-bold text-sm uppercase tracking-widest transition-all active:scale-[0.98] mt-2">
                Create Account
            </button>
        </form>

        <div class="mt-5 pt-5 border-t border-white/5 text-center">
            <a href="/" class="text-slate-500 hover:text-slate-300 text-xs font-medium transition-colors">
                Continue browsing without an account →
            </a>
        </div>
    </div>

    <p class="text-center text-slate-600 text-xs mt-6">
        An account lets you access your tickets anytime at <a href="/my-tickets" class="text-indigo-500 hover:text-indigo-400">My Tickets</a>.
    </p>
</div>

<script>
    function showTab(tab) {
        const isLogin = tab === 'login';
        document.getElementById('login-form').classList.toggle('hidden', !isLogin);
        document.getElementById('register-form').classList.toggle('hidden', isLogin);
        document.getElementById('tab-login').className = `flex-1 py-2 rounded-lg text-sm font-bold transition-all ${isLogin ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`;
        document.getElementById('tab-register').className = `flex-1 py-2 rounded-lg text-sm font-bold transition-all ${!isLogin ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`;
        hideMsg();
    }

    function showMsg(text, isError) {
        const el = document.getElementById('msg');
        el.textContent = text;
        el.className = `mb-5 px-4 py-3 rounded-xl text-sm font-medium ${isError ? 'bg-red-500/10 border border-red-500/20 text-red-400' : 'bg-green-500/10 border border-green-500/20 text-green-400'}`;
    }

    function hideMsg() {
        document.getElementById('msg').className = 'hidden mb-5 px-4 py-3 rounded-xl text-sm font-medium';
    }

    function setLoading(btnId, loading) {
        const btn = document.getElementById(btnId);
        btn.disabled = loading;
        btn.textContent = loading ? 'Please wait...' : (btnId === 'login-btn' ? 'Sign In' : 'Create Account');
        btn.classList.toggle('opacity-60', loading);
    }

    async function handleLogin(e) {
        e.preventDefault();
        setLoading('login-btn', true);
        try {
            const res = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('login-email').value,
                    password: document.getElementById('login-password').value
                })
            });
            const data = await res.json();
            if (!res.ok) { showMsg(data.error || 'Login failed.', true); return; }
            localStorage.setItem('campustix_token', data.token);
            localStorage.setItem('campustix_user', JSON.stringify({ name: data.name, email: data.email }));
            showMsg('Welcome back, ' + data.name + '! Redirecting...', false);
            setTimeout(() => window.location.href = new URLSearchParams(location.search).get('redirect') || '/', 1000);
        } catch { showMsg('Server error. Please try again.', true); }
        finally { setLoading('login-btn', false); }
    }

    async function handleRegister(e) {
        e.preventDefault();
        setLoading('register-btn', true);
        try {
            const res = await fetch('/api/v1/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('reg-name').value,
                    email: document.getElementById('reg-email').value,
                    password: document.getElementById('reg-password').value
                })
            });
            const data = await res.json();
            if (!res.ok) { showMsg(data.error || 'Registration failed.', true); return; }
            localStorage.setItem('campustix_token', data.token);
            localStorage.setItem('campustix_user', JSON.stringify({ name: data.name, email: data.email }));
            showMsg('Account created! Welcome, ' + data.name + '!', false);
            setTimeout(() => window.location.href = '/', 1200);
        } catch { showMsg('Server error. Please try again.', true); }
        finally { setLoading('register-btn', false); }
    }

    // Auto-redirect if already logged in
    if (localStorage.getItem('campustix_token')) {
        window.location.href = '/';
    }
</script>
</body>
</html>
