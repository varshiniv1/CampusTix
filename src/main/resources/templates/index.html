<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CampusTix | High-Concurrency Ticketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen">
<nav class="border-b border-slate-800 bg-[#0f172a]/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center font-bold">C</div>
            <span class="text-xl font-bold tracking-tight uppercase">Campus<span class="text-indigo-500">Tix</span></span>
        </div>
        <div id="status" class="flex items-center gap-2 text-xs font-medium px-3 py-1 rounded-full bg-slate-800 border border-slate-700">
            <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
            <span id="status-text">DISCONNECTED</span>
        </div>
    </div>
</nav>

<main class="max-w-7xl mx-auto px-6 py-10 grid grid-cols-12 gap-8">
    <div class="col-span-12 lg:col-span-8 space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
            <div class="flex justify-between items-end mb-10">
                <div>
                    <h2 class="text-2xl font-bold text-white">Main Stadium Arena</h2>
                    <p class="text-slate-400 text-sm">Select an available seat to start the Kafka-driven booking process.</p>
                </div>
                <div class="flex gap-4 text-xs uppercase font-semibold">
                    <div class="flex items-center gap-2"><span class="w-3 h-3 bg-slate-700 rounded-sm"></span> Available</div>
                    <div class="flex items-center gap-2"><span class="w-3 h-3 bg-indigo-600 rounded-sm"></span> Yours</div>
                    <div class="flex items-center gap-2"><span class="w-3 h-3 bg-red-900 rounded-sm"></span> Sold</div>
                </div>
            </div>

            <div id="stadium" class="grid grid-cols-8 gap-3 max-w-2xl mx-auto py-10">
            </div>

            <div class="mt-8 pt-6 border-t border-slate-800 flex justify-center">
                <div class="h-2 w-64 bg-slate-800 rounded-full overflow-hidden relative">
                    <div class="absolute inset-0 bg-indigo-600 w-1/3 shadow-[0_0_15px_rgba(79,70,229,0.5)]"></div>
                </div>
                <span class="ml-4 text-[10px] text-slate-500 uppercase tracking-widest">Stage / Screen</span>
            </div>
        </div>
    </div>

    <div class="col-span-12 lg:col-span-4 space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 h-fit sticky top-28">
            <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                <span class="text-indigo-500 font-mono">01</span> Distribution Logs
            </h3>
            <div id="logs" class="space-y-3 h-[400px] overflow-y-auto pr-2 custom-scrollbar font-mono text-[11px]">
                <div class="text-slate-600 italic uppercase tracking-tighter">Initialising System Listeners...</div>
            </div>
        </div>
    </div>
</main>

<script>
    let stompClient = null;
    const STUDENT_ID = "student_" + Math.floor(Math.random() * 1000); // Random test user

    function connect() {
        const socket = new SockJS('/ws-tickets');
        stompClient = Stomp.over(socket);
        stompClient.debug = null; // Quiet mode
        stompClient.connect({}, function () {
            document.getElementById('status-text').innerText = "SYSTEM LIVE";
            document.getElementById('status').querySelector('span').classList.replace('bg-red-500', 'bg-green-500');

            // Listen for personal updates
            stompClient.subscribe(`/user/${STUDENT_ID}/topic/status`, (msg) => {
                const isSuccess = msg.body.includes("SUCCESS");
                addLog(msg.body, isSuccess ? "text-green-400" : "text-red-400");
                loadSeats(); // Refresh map
            });
        });
    }

    async function loadSeats() {
        const res = await fetch('/api/v1/tickets/seats');
        const seats = await res.json();
        const stadium = document.getElementById('stadium');
        stadium.innerHTML = '';

        seats.forEach(seat => {
            const div = document.createElement('div');
            const isSold = seat.status === 'SOLD';
            div.className = `h-12 flex items-center justify-center rounded-xl text-[10px] font-bold cursor-pointer transition-all duration-300 border
                ${isSold ? 'bg-red-900/20 border-red-900/50 text-red-500 cursor-not-allowed' : 'bg-slate-800 border-slate-700 hover:border-indigo-500 hover:scale-110 text-slate-400'}`;
            div.innerText = seat.seatNumber;
            if(!isSold) div.onclick = () => claim(seat.id, seat.seatNumber);
            stadium.appendChild(div);
        });
    }

    async function claim(id, name) {
        addLog(`Requesting ${name} via Kafka...`, "text-slate-400");
        const res = await fetch(`/api/v1/tickets/claim?studentId=${STUDENT_ID}&seatId=${id}`, { method: 'POST' });
        if (res.status === 429) addLog("Rate limit hit! Redis blocked request.", "text-orange-400");
    }

    function addLog(text, color) {
        const logs = document.getElementById('logs');
        const entry = document.createElement('div');
        entry.className = `p-2 rounded bg-slate-950 border-l-2 border-slate-800 ${color}`;
        entry.innerHTML = `<span class="opacity-30">[${new Date().toLocaleTimeString()}]</span> ${text}`;
        logs.prepend(entry);
    }

    connect();
    loadSeats();
</script>
</body>
</html>
