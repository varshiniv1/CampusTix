<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusTix | Live Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .cat-btn.active { background: #4f46e5; color: white; }
        .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(79,70,229,0.15); }
    </style>
</head>
<body class="bg-[#06081C] text-white min-h-screen">

<!-- Sticky Navigation -->
<nav class="sticky top-0 z-50 bg-[#06081C]/95 backdrop-blur-md border-b border-white/5">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center gap-4">
        <a href="/" class="flex items-center gap-2 mr-4 flex-shrink-0">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center font-black text-sm">C</div>
            <span class="text-lg font-black tracking-tight">Campus<span class="text-indigo-400">Tix</span></span>
        </a>

        <div class="flex-1 max-w-lg hidden md:block">
            <input id="nav-search" type="text" placeholder="Search events, artists, venues..."
                class="w-full bg-white/8 border border-white/10 rounded-full px-4 py-2 text-sm outline-none focus:border-indigo-500/60 focus:bg-white/10 transition-all placeholder-slate-500"
                oninput="filterEvents()">
        </div>

        <div class="flex items-center gap-3 ml-auto">
            <a href="/my-tickets" class="text-sm font-medium text-slate-400 hover:text-white transition-colors hidden sm:block">My Tickets</a>
            <a href="/admin" class="text-sm font-medium text-slate-500 hover:text-slate-300 transition-colors hidden sm:block">Admin</a>
            <a href="/login" id="nav-auth-btn" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-full text-sm font-bold transition-all flex-shrink-0">Sign In</a>
        </div>
    </div>
</nav>

<!-- Hero Section -->
<div class="relative overflow-hidden pt-16 pb-14 px-6">
    <div class="absolute inset-0 bg-gradient-to-br from-indigo-900/25 via-purple-900/10 to-transparent pointer-events-none"></div>
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative max-w-4xl mx-auto text-center">
        <div class="inline-flex items-center gap-2 bg-indigo-500/10 border border-indigo-500/20 rounded-full px-4 py-1.5 text-xs font-bold text-indigo-400 uppercase tracking-widest mb-5">
            <span class="w-1.5 h-1.5 bg-indigo-400 rounded-full animate-pulse"></span>
            Events Live Now
        </div>
        <h1 class="text-4xl md:text-6xl font-black tracking-tight leading-none mb-3">
            Find Your Next<br>
            <span class="bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                Live Experience
            </span>
        </h1>
        <p class="text-slate-400 text-base md:text-lg mb-8 max-w-xl mx-auto leading-relaxed">
            Concerts, sports, theater, comedy and more — all in one place.
        </p>

        <div class="max-w-2xl mx-auto relative">
            <input id="hero-search" type="text" placeholder="What are you looking for?"
                class="w-full bg-white/8 border border-white/10 rounded-2xl px-5 py-4 text-sm outline-none focus:border-indigo-500/50 focus:bg-white/10 transition-all placeholder-slate-500 pr-32"
                oninput="filterEvents()">
            <button class="absolute right-2 top-2 bg-indigo-600 hover:bg-indigo-500 px-5 py-2 rounded-xl text-sm font-bold transition-all active:scale-95">
                Search
            </button>
        </div>
    </div>
</div>

<!-- Category Filter -->
<div class="max-w-7xl mx-auto px-6 mb-8">
    <div class="flex items-center gap-2.5 overflow-x-auto pb-2 scrollbar-hide">
        <button onclick="setCategory('')" data-cat="" class="cat-btn active flex-shrink-0 flex items-center gap-2 border border-indigo-500 text-white px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap transition-all hover:border-indigo-400">
            All Events
        </button>
        <button onclick="setCategory('MUSIC')" data-cat="MUSIC" class="cat-btn flex-shrink-0 flex items-center gap-2 bg-white/5 border border-white/10 text-slate-300 hover:border-white/30 hover:text-white px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap transition-all">
            🎵 Music
        </button>
        <button onclick="setCategory('SPORTS')" data-cat="SPORTS" class="cat-btn flex-shrink-0 flex items-center gap-2 bg-white/5 border border-white/10 text-slate-300 hover:border-white/30 hover:text-white px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap transition-all">
            🏀 Sports
        </button>
        <button onclick="setCategory('COMEDY')" data-cat="COMEDY" class="cat-btn flex-shrink-0 flex items-center gap-2 bg-white/5 border border-white/10 text-slate-300 hover:border-white/30 hover:text-white px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap transition-all">
            😂 Comedy
        </button>
        <button onclick="setCategory('ARTS')" data-cat="ARTS" class="cat-btn flex-shrink-0 flex items-center gap-2 bg-white/5 border border-white/10 text-slate-300 hover:border-white/30 hover:text-white px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap transition-all">
            🎭 Arts & Theater
        </button>
        <button onclick="setCategory('MOVIES')" data-cat="MOVIES" class="cat-btn flex-shrink-0 flex items-center gap-2 bg-white/5 border border-white/10 text-slate-300 hover:border-white/30 hover:text-white px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap transition-all">
            🎬 Movies
        </button>
        <button onclick="setCategory('FAMILY')" data-cat="FAMILY" class="cat-btn flex-shrink-0 flex items-center gap-2 bg-white/5 border border-white/10 text-slate-300 hover:border-white/30 hover:text-white px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap transition-all">
            👨‍👩‍👧 Family
        </button>
    </div>
</div>

<!-- Events Grid -->
<div class="max-w-7xl mx-auto px-6 pb-20">
    <div class="flex items-center justify-between mb-5">
        <h2 id="section-title" class="text-lg font-bold text-white">All Events</h2>
        <span id="event-count" class="text-sm text-slate-500"></span>
    </div>

    <div id="event-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
        <div class="col-span-full flex items-center justify-center py-20">
            <div class="flex items-center gap-3 text-slate-500">
                <div class="w-5 h-5 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                <span class="text-sm">Loading events...</span>
            </div>
        </div>
    </div>
</div>

<script>
    let allEvents = [];
    let activeCategory = '';

    async function loadEvents() {
        // Always clear search on fresh page load so newly created events are visible
        document.getElementById('hero-search').value = '';
        document.getElementById('nav-search').value = '';

        try {
            // Timestamp param prevents browser from serving a cached response
            const res = await fetch('/api/v1/admin/events/all?_t=' + Date.now());
            if (!res.ok) throw new Error('HTTP ' + res.status);
            allEvents = await res.json();
            renderEvents(allEvents);
            updateAuthButton();
        } catch (err) {
            document.getElementById('event-grid').innerHTML = `
                <div class="col-span-full text-center py-16 text-red-400 text-sm">
                    Failed to load events (${err.message}). Ensure the server is running.
                </div>`;
        }
    }

    function setCategory(cat) {
        activeCategory = cat;
        // Clear search text when switching category so events aren't accidentally hidden
        document.getElementById('hero-search').value = '';
        document.getElementById('nav-search').value = '';

        document.querySelectorAll('.cat-btn').forEach(btn => {
            const isActive = btn.dataset.cat === cat;
            btn.classList.toggle('active', isActive);
            btn.classList.toggle('border-indigo-500', isActive);
            btn.classList.toggle('text-white', isActive);
            btn.classList.toggle('bg-white/5', !isActive);
            btn.classList.toggle('border-white/10', !isActive);
            btn.classList.toggle('text-slate-300', !isActive);
        });
        const titles = { MUSIC:'Music', SPORTS:'Sports', COMEDY:'Comedy', ARTS:'Arts & Theater', MOVIES:'Movies', FAMILY:'Family' };
        document.getElementById('section-title').textContent = cat ? (titles[cat] || cat) + ' Events' : 'All Events';
        filterEvents();
    }

    function filterEvents() {
        const query = (document.getElementById('hero-search').value || document.getElementById('nav-search').value || '').toLowerCase().trim();
        const filtered = allEvents.filter(ev => {
            const matchesSearch = !query ||
                (ev.name  && ev.name.toLowerCase().includes(query)) ||
                (ev.venue && ev.venue.toLowerCase().includes(query)) ||
                (ev.description && ev.description.toLowerCase().includes(query));
            const matchesCat = !activeCategory || ev.category === activeCategory;
            return matchesSearch && matchesCat;
        });
        renderEvents(filtered);
    }

    function renderEvents(events) {
        const grid = document.getElementById('event-grid');
        const countEl = document.getElementById('event-count');
        countEl.textContent = events.length + ' event' + (events.length !== 1 ? 's' : '');

        if (!events.length) {
            grid.innerHTML = `
                <div class="col-span-full text-center py-16">
                    <div class="text-4xl mb-3">🎭</div>
                    <p class="text-slate-400 font-medium">No events found</p>
                    <p class="text-slate-600 text-sm mt-1">Try a different category or search term</p>
                </div>`;
            return;
        }

        grid.innerHTML = events.map(ev => {
            const now = new Date();
            const expiry = ev.expiryDate ? new Date(ev.expiryDate) : new Date(now.getTime() + 86400000);
            const isExpired = now > expiry;
            const eventDate = ev.eventTime ? new Date(ev.eventTime) : null;
            const formattedDate = eventDate
                ? eventDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })
                : 'Date TBD';
            const formattedTime = eventDate
                ? eventDate.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })
                : '';

            const categoryLabel = ev.category || 'EVENT';
            const categoryEmoji = { MUSIC: '🎵', SPORTS: '🏀', COMEDY: '😂', ARTS: '🎭', MOVIES: '🎬', FAMILY: '👨‍👩‍👧' }[categoryLabel] || '🎟️';

            return `
            <div class="card-hover group bg-[#0E1028] border border-white/5 rounded-2xl overflow-hidden ${isExpired ? 'opacity-50 grayscale' : ''}">
                <div class="relative h-48 overflow-hidden bg-slate-800">
                    <img src="${ev.imageUrl || 'https://images.unsplash.com/photo-1540039155733-5bb30b53aa14?w=600'}"
                        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                        onerror="this.src='https://images.unsplash.com/photo-1540039155733-5bb30b53aa14?w=600'"
                        alt="${ev.name}">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#0E1028] via-transparent to-transparent"></div>

                    <div class="absolute top-3 left-3 bg-black/60 backdrop-blur-sm px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider text-indigo-300 border border-indigo-500/20">
                        ${categoryEmoji} ${categoryLabel}
                    </div>

                    ${isExpired ? `
                    <div class="absolute top-3 right-3 bg-red-500/90 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase text-white">
                        Ended
                    </div>` : `
                    <div class="absolute top-3 right-3 bg-green-500/20 border border-green-500/30 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase text-green-400">
                        On Sale
                    </div>`}
                </div>

                <div class="p-4">
                    <p class="text-indigo-400 text-[11px] font-bold uppercase tracking-widest mb-1">
                        ${formattedDate}${formattedTime ? ' · ' + formattedTime : ''}
                    </p>
                    <h3 class="text-white font-bold text-base leading-tight mb-2 line-clamp-2">${ev.name}</h3>
                    <p class="text-slate-500 text-xs flex items-center gap-1 mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        ${ev.venue || 'Venue TBD'}
                    </p>
                    <div class="flex items-center justify-between">
                        <div>
                            <span class="text-slate-500 text-[10px] font-medium">From</span>
                            <span class="text-white font-black text-xl ml-1">$${Number(ev.price || 0).toFixed(0)}</span>
                        </div>
                        ${isExpired
                            ? `<button class="bg-slate-800 text-slate-500 px-4 py-2 rounded-xl text-xs font-bold cursor-not-allowed">Ended</button>`
                            : `<a href="/booking/${ev.id}" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wide transition-all">Get Tickets</a>`
                        }
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function updateAuthButton() {
        const user = JSON.parse(localStorage.getItem('campustix_user') || 'null');
        const btn = document.getElementById('nav-auth-btn');
        if (user) {
            btn.textContent = user.name.split(' ')[0];
            btn.href = '/my-tickets';
            btn.classList.replace('bg-indigo-600', 'bg-white/10');
            btn.classList.replace('hover:bg-indigo-500', 'hover:bg-white/20');
        }
    }

    document.addEventListener('DOMContentLoaded', loadEvents);
</script>
</body>
</html>
