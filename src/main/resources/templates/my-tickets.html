<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusTix | My Tickets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="bg-[#06081C] text-white min-h-screen">

<!-- Nav -->
<nav class="sticky top-0 z-50 bg-[#06081C]/95 backdrop-blur-md border-b border-white/5 no-print">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center font-black text-sm">C</div>
            <span class="text-lg font-black tracking-tight">Campus<span class="text-indigo-400">Tix</span></span>
        </a>
        <div class="flex items-center gap-4">
            <a href="/" class="text-sm text-slate-400 hover:text-white transition-colors">Browse Events</a>
            <button id="logout-btn" onclick="logout()" class="hidden text-sm text-slate-500 hover:text-red-400 transition-colors font-medium">Sign Out</button>
        </div>
    </div>
</nav>

<div class="max-w-5xl mx-auto px-6 py-10">

    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-3xl font-black tracking-tight mb-1">My Tickets</h1>
        <p class="text-slate-400 text-sm">View and download your event tickets</p>
    </div>

    <!-- Lookup Panel (shown when not logged in) -->
    <div id="lookup-panel" class="hidden">
        <div class="bg-[#0E1028] border border-white/8 rounded-3xl p-8 max-w-lg mb-10">
            <h2 class="text-lg font-bold mb-1">Find Your Tickets</h2>
            <p class="text-slate-400 text-sm mb-5">Enter the email you used when booking to view all your tickets.</p>
            <div class="flex gap-3">
                <input id="lookup-email" type="email" placeholder="your@email.com"
                    class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-indigo-500/50 transition-all placeholder-slate-600">
                <button onclick="lookupByEmail()"
                    class="bg-indigo-600 hover:bg-indigo-500 px-5 py-3 rounded-xl text-sm font-bold transition-all active:scale-95 whitespace-nowrap">
                    Find Tickets
                </button>
            </div>
            <p id="lookup-msg" class="text-red-400 text-xs mt-2 hidden"></p>
        </div>
    </div>

    <!-- Tickets Grid -->
    <div id="tickets-container">
        <div class="flex items-center justify-center py-20">
            <div class="flex items-center gap-3 text-slate-500">
                <div class="w-5 h-5 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                <span class="text-sm">Loading tickets...</span>
            </div>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('campustix_token');
    const user = JSON.parse(localStorage.getItem('campustix_user') || 'null');

    function logout() {
        localStorage.removeItem('campustix_token');
        localStorage.removeItem('campustix_user');
        window.location.reload();
    }

    async function init() {
        if (user) {
            document.getElementById('logout-btn').classList.remove('hidden');
            await loadMyBookings();
        } else {
            document.getElementById('lookup-panel').classList.remove('hidden');
            document.getElementById('tickets-container').innerHTML = '';
        }
    }

    async function loadMyBookings() {
        try {
            const res = await fetch('/api/v1/bookings/my-bookings', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (!res.ok) {
                showLookup();
                return;
            }
            const bookings = await res.json();
            renderTickets(bookings, user.name);
        } catch {
            showLookup();
        }
    }

    function showLookup() {
        document.getElementById('lookup-panel').classList.remove('hidden');
        document.getElementById('tickets-container').innerHTML = '';
    }

    async function lookupByEmail() {
        const email = document.getElementById('lookup-email').value.trim();
        const msg = document.getElementById('lookup-msg');
        if (!email || !email.includes('@')) {
            msg.textContent = 'Please enter a valid email address.';
            msg.classList.remove('hidden');
            return;
        }
        msg.classList.add('hidden');

        const res = await fetch('/api/v1/bookings/by-email?email=' + encodeURIComponent(email));
        const bookings = await res.json();

        if (!bookings.length) {
            msg.textContent = 'No tickets found for this email.';
            msg.classList.remove('hidden');
            return;
        }
        renderTickets(bookings, email);
    }

    function renderTickets(bookings, label) {
        const container = document.getElementById('tickets-container');

        if (!bookings.length) {
            container.innerHTML = `
                <div class="text-center py-20">
                    <div class="text-5xl mb-4">🎟️</div>
                    <p class="text-slate-300 font-semibold text-lg mb-2">No tickets yet</p>
                    <p class="text-slate-500 text-sm mb-6">Head to the marketplace to find events near you.</p>
                    <a href="/" class="inline-block bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-xl text-sm font-bold transition-all">Browse Events</a>
                </div>`;
            return;
        }

        container.innerHTML = `
            <p class="text-slate-500 text-sm mb-5">${bookings.length} ticket${bookings.length !== 1 ? 's' : ''} found</p>
            <div class="space-y-4">
                ${bookings.map(b => renderTicketCard(b)).join('')}
            </div>`;
    }

    function renderTicketCard(b) {
        const isConfirmed = b.status === 'CONFIRMED';
        const eventDate = b.eventTime ? new Date(b.eventTime) : null;
        const formattedDate = eventDate
            ? eventDate.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })
            : 'Date TBD';
        const formattedTime = eventDate
            ? eventDate.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })
            : '';

        return `
        <div class="bg-[#0E1028] border border-white/8 rounded-3xl overflow-hidden">
            <!-- Ticket Header -->
            <div class="flex gap-0">
                <!-- Left: Event Image -->
                <div class="w-32 sm:w-48 flex-shrink-0 relative">
                    <img src="${b.eventImageUrl || 'https://images.unsplash.com/photo-1540039155733-5bb30b53aa14?w=400'}"
                        class="w-full h-full object-cover"
                        onerror="this.src='https://images.unsplash.com/photo-1540039155733-5bb30b53aa14?w=400'"
                        alt="${b.eventName}">
                    <div class="absolute inset-0 bg-gradient-to-r from-transparent to-[#0E1028]"></div>
                </div>

                <!-- Right: Ticket Info -->
                <div class="flex-1 p-5 sm:p-7">
                    <div class="flex items-start justify-between gap-3 mb-3">
                        <div>
                            <p class="text-indigo-400 text-[10px] font-bold uppercase tracking-widest mb-1">${formattedDate}${formattedTime ? ' · ' + formattedTime : ''}</p>
                            <h3 class="text-white font-black text-xl leading-tight">${b.eventName}</h3>
                            <p class="text-slate-500 text-sm mt-1 flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                                ${b.venue || 'Venue TBD'}
                            </p>
                        </div>
                        <span class="flex-shrink-0 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider ${isConfirmed ? 'bg-green-500/15 text-green-400 border border-green-500/20' : 'bg-red-500/15 text-red-400 border border-red-500/20'}">
                            ${b.status}
                        </span>
                    </div>

                    <div class="flex items-center gap-6 mt-4">
                        <div>
                            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Seat</p>
                            <p class="text-indigo-400 font-black text-2xl">${b.seatNumber}</p>
                        </div>
                        <div>
                            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Ref</p>
                            <p class="text-white font-mono font-bold text-sm">${b.bookingReference}</p>
                        </div>
                        <div>
                            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Attendee</p>
                            <p class="text-white font-semibold text-sm">${b.buyerName}</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Dashed divider -->
            <div class="border-t border-dashed border-white/10 mx-6 relative">
                <div class="absolute -left-8 -top-3 w-6 h-6 bg-[#06081C] rounded-full"></div>
                <div class="absolute -right-8 -top-3 w-6 h-6 bg-[#06081C] rounded-full"></div>
            </div>

            <!-- QR Code Section -->
            <div class="px-7 py-5 flex items-center justify-between gap-6">
                <div class="flex-1">
                    <p class="text-slate-500 text-xs font-semibold mb-1">Booked on ${b.bookedAt ? new Date(b.bookedAt).toLocaleDateString() : 'N/A'}</p>
                    <p class="text-slate-400 text-xs leading-relaxed">Present the QR code at the venue entrance. This ticket is your proof of purchase.</p>
                    <button onclick="downloadQR('${b.bookingReference}', '${b.qrCodeBase64}')"
                        class="mt-3 flex items-center gap-2 bg-white/8 hover:bg-white/12 border border-white/10 px-4 py-2 rounded-xl text-xs font-bold transition-all active:scale-95 no-print">
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Download Ticket
                    </button>
                </div>
                ${b.qrCodeBase64 ? `
                <div class="flex-shrink-0 bg-white p-2.5 rounded-2xl shadow-lg">
                    <img src="data:image/png;base64,${b.qrCodeBase64}" class="w-24 h-24 sm:w-28 sm:h-28" alt="QR Code">
                </div>` : `
                <div class="flex-shrink-0 w-24 h-24 bg-white/5 border border-white/10 rounded-2xl flex items-center justify-center text-slate-600 text-xs text-center px-2">
                    QR not available
                </div>`}
            </div>
        </div>`;
    }

    function downloadQR(ref, qrBase64) {
        if (!qrBase64) return;
        const link = document.createElement('a');
        link.href = 'data:image/png;base64,' + qrBase64;
        link.download = 'campustix-' + ref + '.png';
        link.click();
    }

    init();
</script>
</body>
</html>
