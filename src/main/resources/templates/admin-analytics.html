<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusTix | Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#06081C] text-white min-h-screen">

<nav class="sticky top-0 z-50 bg-[#06081C]/95 backdrop-blur-md border-b border-white/5">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center font-black text-sm">C</div>
            <span class="text-lg font-black tracking-tight">Campus<span class="text-indigo-400">Tix</span></span>
        </a>
        <div class="flex items-center gap-4">
            <span class="bg-amber-500/15 text-amber-400 border border-amber-500/20 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest">Analytics</span>
            <a href="/admin" class="text-sm text-slate-400 hover:text-white transition-colors">Create Event</a>
            <a href="/" class="text-sm text-slate-400 hover:text-white transition-colors">Marketplace</a>
        </div>
    </div>
</nav>

<div id="unauth" class="hidden fixed inset-0 z-[100] bg-[#06081C] flex items-center justify-center">
    <div class="text-center">
        <p class="text-slate-400 mb-4">Session expired. Please log in again.</p>
        <a href="/admin" class="bg-amber-500 text-black font-black px-6 py-3 rounded-xl text-sm uppercase tracking-widest">Go to Admin Login</a>
    </div>
</div>

<div class="max-w-6xl mx-auto px-6 py-10">
    <div class="mb-8 flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-black tracking-tight mb-1">Analytics Dashboard</h1>
            <p id="last-updated" class="text-slate-400 text-sm"></p>
        </div>
        <button onclick="loadAnalytics()" class="bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-indigo-600/30 transition-all">
            Refresh
        </button>
    </div>

    <!-- KPI Cards -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        <div class="bg-[#0E1028] border border-white/8 rounded-2xl p-5">
            <p class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-2">Total Events</p>
            <p id="kpi-events" class="text-4xl font-black text-white">—</p>
        </div>
        <div class="bg-[#0E1028] border border-white/8 rounded-2xl p-5">
            <p class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-2">Tickets Sold</p>
            <p id="kpi-bookings" class="text-4xl font-black text-indigo-400">—</p>
        </div>
        <div class="bg-[#0E1028] border border-white/8 rounded-2xl p-5">
            <p class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-2">Total Revenue</p>
            <p id="kpi-revenue" class="text-4xl font-black text-green-400">—</p>
        </div>
        <div class="bg-[#0E1028] border border-white/8 rounded-2xl p-5">
            <p class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-2">On Waitlist</p>
            <p id="kpi-waitlist" class="text-4xl font-black text-amber-400">—</p>
        </div>
    </div>

    <div class="grid grid-cols-12 gap-6">

        <!-- Top Events Table -->
        <div class="col-span-12 lg:col-span-7">
            <div class="bg-[#0E1028] border border-white/8 rounded-3xl p-6">
                <h2 class="text-xs text-slate-500 font-black uppercase tracking-widest mb-5">Events Performance</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="text-slate-500 text-xs uppercase tracking-wider">
                                <th class="text-left pb-3 font-semibold">Event</th>
                                <th class="text-right pb-3 font-semibold">Sold</th>
                                <th class="text-right pb-3 font-semibold">Available</th>
                                <th class="text-right pb-3 font-semibold">Waitlist</th>
                                <th class="text-right pb-3 font-semibold">Revenue</th>
                            </tr>
                        </thead>
                        <tbody id="events-table" class="divide-y divide-white/5">
                            <tr><td colspan="5" class="text-slate-500 text-center py-6">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Recent Bookings -->
        <div class="col-span-12 lg:col-span-5">
            <div class="bg-[#0E1028] border border-white/8 rounded-3xl p-6">
                <h2 class="text-xs text-slate-500 font-black uppercase tracking-widest mb-5">Recent Bookings</h2>
                <div id="recent-bookings" class="space-y-3">
                    <p class="text-slate-500 text-sm text-center py-4">Loading...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function loadAnalytics() {
        try {
            const res = await fetch('/api/v1/admin/analytics');
            if (res.status === 401 || res.status === 403) {
                document.getElementById('unauth').classList.remove('hidden');
                return;
            }
            const data = await res.json();

            document.getElementById('kpi-events').textContent = data.totalEvents;
            document.getElementById('kpi-bookings').textContent = data.totalBookings;
            document.getElementById('kpi-revenue').textContent = '$' + data.totalRevenue.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('kpi-waitlist').textContent = data.totalWaitlisted;
            document.getElementById('last-updated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();

            // Events table
            const tbody = document.getElementById('events-table');
            if (data.topEvents.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-slate-500 text-center py-6">No events yet.</td></tr>';
            } else {
                tbody.innerHTML = data.topEvents.map(e => `
                    <tr>
                        <td class="py-3 pr-4">
                            <p class="text-white font-semibold text-sm">${e.eventName}</p>
                            <p class="text-slate-500 text-xs">${e.category || 'OTHER'}</p>
                        </td>
                        <td class="py-3 text-right text-indigo-400 font-bold">${e.bookings}</td>
                        <td class="py-3 text-right text-green-400 font-semibold">${e.availableSeats}</td>
                        <td class="py-3 text-right text-amber-400 font-semibold">${e.waitlisted}</td>
                        <td class="py-3 text-right text-white font-semibold">$${e.revenue.toFixed(2)}</td>
                    </tr>
                `).join('');
            }

            // Recent bookings
            const recentEl = document.getElementById('recent-bookings');
            if (data.recentBookings.length === 0) {
                recentEl.innerHTML = '<p class="text-slate-500 text-sm text-center py-4">No bookings yet.</p>';
            } else {
                recentEl.innerHTML = data.recentBookings.map(b => `
                    <div class="flex items-start justify-between gap-3 py-2 border-b border-white/5 last:border-0">
                        <div class="min-w-0">
                            <p class="text-white text-xs font-semibold truncate">${b.buyerName}</p>
                            <p class="text-slate-500 text-[11px] truncate">${b.eventName} · ${b.seatNumber}</p>
                        </div>
                        <div class="text-right flex-shrink-0">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${b.status === 'CONFIRMED' ? 'bg-green-500/15 text-green-400' : 'bg-red-500/15 text-red-400'}">${b.status}</span>
                            <p class="text-slate-600 text-[10px] mt-1">${b.ref}</p>
                        </div>
                    </div>
                `).join('');
            }
        } catch (e) {
            console.error('Analytics load failed', e);
        }
    }

    loadAnalytics();
</script>
</body>
</html>
