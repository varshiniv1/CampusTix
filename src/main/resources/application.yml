server:
  port: ${PORT:8080}

spring:
  application:
    name: campustix

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:pcmbwow@gmail.com}
    password: ${MAIL_PASSWORD:qznwdwiqejvunvjm}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/campustix}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cache:
    type: redis

ai:
  base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:llama-3.1-8b-instant}

admin:
  username: ${ADMIN_USERNAME:username}
  password: ${ADMIN_PASSWORD:password}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: campustix

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
