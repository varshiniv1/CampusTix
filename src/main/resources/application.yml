spring:
  application:
    name: campustix

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:pcmbwow@gmail.com}
    password: ${MAIL_PASSWORD:your-16-char-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/campustix}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}


ai:
  base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
  api-key: ${AI_API_KEY:your-gemini-api-key}
  model: ${AI_MODEL:gemini-2.0-flash}
