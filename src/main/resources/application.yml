spring:
  application:
    name: campustix

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:pcmbwow@gmail.com}
    password: ${MAIL_PASSWORD:your-16-char-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campustix}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: campustix-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLXNlY3JldC1rZXktZm9yLWNhbXB1c3RpeC0yMDI1}

ai:
  # Unsloth Studio local server (run: unsloth studio -p 8888, API usually on 8080)
  base-url: ${AI_BASE_URL:http://localhost:8080}
  api-key: ${AI_API_KEY:sk-unsloth-placeholder}
  model: ${AI_MODEL:unsloth/Qwen2.5-7B-Instruct-GGUF}
