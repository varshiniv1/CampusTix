# Performance testing overlay — run on top of docker-compose.yml
#
# Usage (app must already be running):
#   docker compose -f docker-compose.yml -f docker-compose.perf.yml up k6-booking
#   docker compose -f docker-compose.yml -f docker-compose.perf.yml up k6-chaos
#
# Or run standalone against a live app:
#   docker compose -f docker-compose.perf.yml run --rm k6-booking

services:

  # ── Booking load test (500 VUs, latency + throughput) ─────────────────────
  k6-booking:
    image: grafana/k6:latest
    volumes:
      - ./k6:/scripts
      - ./k6/results:/results
    environment:
      - BASE_URL=${APP_URL:-http://host.docker.internal:8080}
    command: run --out json=/results/booking_results.json /scripts/load_test_booking.js
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── AI circuit breaker chaos test ─────────────────────────────────────────
  k6-chaos:
    image: grafana/k6:latest
    volumes:
      - ./k6:/scripts
      - ./k6/results:/results
    environment:
      - BASE_URL=${APP_URL:-http://host.docker.internal:8080}
    command: run --out json=/results/chaos_results.json /scripts/circuit_breaker_chaos.js
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── InfluxDB for persisting k6 results (optional) ─────────────────────────
  influxdb:
    image: influxdb:1.8-alpine
    container_name: campustix-influxdb
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    ports:
      - "8086:8086"
    profiles:
      - metrics-storage
